{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Evaluation Summary</h2>
    <div class="row">
        {% for category, status in category_status.items %}
            <div class="col-md-4">
                <div class="card shadow-lg p-3 mb-4 bg-dark text-white">
                    <div class="card-body">
                        <h5 class="card-title">{{ category }}</h5>
                        <p class="card-text">{{ status }}</p>
                        {% if status == "Potential Issues Found >" %}
                            <a href="{% url 'category_details' category=category %}" class="btn btn-danger">View Details</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
